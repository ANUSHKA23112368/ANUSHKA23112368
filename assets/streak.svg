<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="GitHub Streak Stats">
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .fire { fill: #00ff66; filter: drop-shadow(0 0 4px #00ff66); }
    .ring { stroke: #00ff66; fill: none; stroke-width: 3.5; stroke-dasharray: 220; animation: dash 2s linear infinite; }
  </style>
  <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#0d1117" stroke="#00ff66"/>

  <!-- Left: Total Contributions -->
  <g transform="translate(85, 95)" text-anchor="middle">
    <text y="-10" fill="#ffffff" font-size="28" font-weight="800">2,309</text>
    <text y="18" fill="#c9d1d9" font-size="13" font-weight="600">Total Contributions</text>
    <text y="38" fill="#8b949e" font-size="11">Nov 1, 2025 - Present</text>
  </g>

  <!-- Middle Divider -->
  <line x1="170" y1="35" x2="170" y2="160" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Center: Current Streak with Flame -->
  <g transform="translate(247, 95)" text-anchor="middle">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="-12" r="42" stroke="#00ff66" stroke-width="3" fill="#0d1117" fill-opacity="0.6"/>
    <!-- Flame Icon -->
    <path class="fire" d="M -1 -44 C 3 -39, 7 -34, 7 -29 C 7 -24, 3 -21, -1 -21 C -5 -21, -9 -24, -9 -29 C -9 -34, -5 -39, -1 -44 Z" transform="scale(0.85) translate(0, -6)"/>
    <!-- Big Number -->
    <text y="-3" fill="#00ff66" font-size="34" font-weight="800">141</text>
    <!-- Label -->
    <text y="42" fill="#00ff66" font-size="14" font-weight="700">Current Streak</text>
    <text y="59" fill="#8b949e" font-size="11">Jun 25 - Nov 12</text>
  </g>

  <!-- Right Divider -->
  <line x1="325" y1="35" x2="325" y2="160" stroke="#00ff66" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Right: Longest Streak -->
  <g transform="translate(410, 95)" text-anchor="middle">
    <text y="-10" fill="#ffffff" font-size="28" font-weight="800">141</text>
    <text y="18" fill="#c9d1d9" font-size="13" font-weight="600">Longest Streak</text>
    <text y="38" fill="#8b949e" font-size="11">Jun 25 - Nov 12</text>
  </g>
</svg>
